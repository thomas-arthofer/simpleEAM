# Statische Traefik-Konfiguration fuer das lokale Testbett.
# Bewusst OHNE ACME/certificatesResolvers - das Wildcard-Cert kommt als
# defaultCertificate aus dynamic/tls.yml.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true
  insecure: true
